[package]
name = "kodkod-anthropic"
version = "0.1.0"
edition = "2024"
description = "Anthropic Messages provider for Kodkod."
license = "MIT"
repository = "https://github.com/WilmerFHandler/kodkod"
keywords = ["agent", "llm", "anthropic"]
categories = ["asynchronous"]

[dependencies]
kodkod-core = { path = "../kodkod-core", version = "0.1.0" }
kodkod-http = { path = "../kodkod-http", version = "0.1.0" }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
wiremock = "0.6"
